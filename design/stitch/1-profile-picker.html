<!-- Audio Floating Toast Scaffolding -->

<span class="material-symbols-outlined text-tertiary-fixed text-[20px]">volume_up</span>
<span class="font-label-md text-label-md" id="audio-toast-text">Speaking...</span>

<script>
  // Multisensory Audio Cue Simulator for pre-readers
  function playAudioCue(spokenText) {
    const toast = document.getElementById('audio-toast');
    const toastText = document.getElementById('audio-toast-text');
    if (toast && toastText) {
      toastText.textContent = spokenText;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      // Speech synthesis fallback for accessibility
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(spokenText);
        utterance.rate = 0.85; // Slightly slower, clear for toddlers
        utterance.pitch = 1.2; // Cheerful warm pitch
        window.speechSynthesis.speak(utterance);
      }

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 1600);
    }
  }

  function selectLearner(name) {
    playAudioCue('Welcome ' + name + '! Let us play!');
  }

  function addNewLearnerPrompt() {
    playAudioCue('Add a new friend! Grown-up needed.');
  }

  // 3-second hold logic for Parent Lock
  const parentBtn = document.getElementById('parent-lock-btn');
  const lockProgress = document.getElementById('lock-progress');
  let holdTimer = null;
  let startTime = null;

  if (parentBtn && lockProgress) {
    const startHold = (e) => {
      startTime = Date.now();
      holdTimer = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const pct = Math.min(100, (elapsed / 2500) * 100);
        lockProgress.setAttribute('width', pct + '%');
        if (pct >= 100) {
          clearInterval(holdTimer);
          playAudioCue('Grown-up workspace unlocked');
          lockProgress.setAttribute('width', '0%');
        }
      }, 50);
    };

    const stopHold = () => {
      clearInterval(holdTimer);
      lockProgress.setAttribute('width', '0%');
    };

    parentBtn.addEventListener('mousedown', startHold);
    parentBtn.addEventListener('touchstart', startHold);
    parentBtn.addEventListener('mouseup', stopHold);
    parentBtn.addEventListener('mouseleave', stopHold);
    parentBtn.addEventListener('touchend', stopHold);
  }
</script></main>
